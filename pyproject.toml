[project]
name = "SurvivEHR"
dynamic = ["version"]
description = "A competing-risks, time-to-event foundation model for electronic health records"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# FastEHR is deliberately not a dependency: survivehr.models and
# survivehr.modules do not import it. survivehr.experiments and the examples/ scripts do, so clone it
# and put it on PYTHONPATH to use those.
#
# These are the ranges the model classes need: the six third-party packages that the backbone, the
# survival and value heads and the causal metrics callback load (checked by importing them and listing
# what loads). The lower bounds are the versions the reference experiments were run with. The experiment
# entry point, the notebooks and benchmarks, and the plotting and clinical-prediction callbacks in
# survivehr.models (base_callback, *_clinical_prediction_model) need packages that are not declared here:
# hydra-core, polars, pyarrow, pycox, scikit-learn, sklearn-pandas, tdigest, seaborn, matplotlib,
# umap-learn and numba. Install them yourself to run those.
dependencies = [
    "torch>=2.0.1",
    "pytorch-lightning>=2.1.0",
    # The backbone calls get_extended_attention_mask with its 4.x signature.
    "transformers>=4.24.0,<5",
    "numpy>=1.22.3",
    "pandas>=1.4.2",
    "wandb>=0.13.6",
]

[dependency-groups]
dev = [
    "ruff>=0.4.8,<0.5",
]

[tool.uv]
package = true

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/survivehr"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/survivehr",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["*.ipynb", "**/outputs", "**/lightning_logs"]

[tool.ruff.format]
quote-style = "preserve"

# Bug-catching rules only (pyflakes + pycodestyle errors), so upstream code isn't flagged for style.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
