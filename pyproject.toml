[project]
name = "SurvivEHR"
dynamic = ["version"]
description = "A competing-risks, time-to-event foundation model for electronic health records"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = "==3.10.*"
# FastEHR is deliberately not a dependency: survivehr.models and
# survivehr.modules do not import it. survivehr.experiments and the examples/ scripts do, so clone it
# and put it on PYTHONPATH to use those.
dependencies = [
    "torch==2.0.1",
    "pytorch-lightning==2.1.0",
    "transformers==4.24.0",
    "pycox==0.3.0",
    "polars==0.17.12",
    "pandas>=1.4.2",
    "pyarrow==8.0.0",
    "sklearn-pandas==2.2.0",
    "scikit-learn>=1.2.0",
    "numpy==1.22.3",
    "tdigest==0.5.2.2",
    "hydra-core==1.3.2",
    "wandb==0.13.6",
    "seaborn==0.12.1",
    "matplotlib<3.6",
    "umap-learn==0.5.3",
    "numba>=0.57",
]

[dependency-groups]
dev = [
    "ruff>=0.4.8,<0.5",
]

[tool.uv]
package = true

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/survivehr"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/survivehr",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["*.ipynb", "**/outputs", "**/lightning_logs"]

[tool.ruff.format]
quote-style = "preserve"

# Bug-catching rules only (pyflakes + pycodestyle errors), so upstream code isn't flagged for style.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
